<body>
<title>Moviola</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
<style>
/* Layout: editor a una colonna su telefono (anteprima, trasporto, strumenti, timeline, pannello); su desktop pannello a destra. Tema scuro da sala di montaggio, unico. */
:root{
  --bg:#0e1218; --panel:#161c25; --raise:#1e2632; --line:#2a3443;
  --fg:#e8ecf2; --muted:#8e99aa; --dim:#5d6878;
  --accent:#f5c542; --accent-ink:#1a1505; --rec:#ff4b3e; --text-bar:#c9a227; --audio:#2fa59a;
  --f-ui:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-disp:"Anton","Impact","Arial Narrow",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
*{box-sizing:border-box}
button{font:inherit;color:inherit;touch-action:manipulation}
#app{max-width:1320px;margin:0 auto;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:8px 24px;display:flex;flex-direction:column;gap:10px}
@media (min-width:600px){#app{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}

.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-family:var(--f-disp);font-size:24px;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:8px;margin-right:auto}
.save{font-family:var(--f-cond);font-weight:600;font-size:12px;letter-spacing:.06em;color:var(--dim);text-transform:uppercase;align-self:center}
.plist{display:flex;flex-direction:column;gap:8px}
.pitem{display:flex;gap:10px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px;min-width:0}
.pitem.cur{border-color:var(--accent)}
.pitem img,.pitem .ph{width:44px;height:58px;object-fit:cover;border-radius:5px;background:var(--raise);flex:0 0 auto}
.pitem .pinfo{flex:1;min-width:0;cursor:pointer}
.pitem .pinfo b{display:block;font-family:var(--f-cond);font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pitem .pinfo span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tin{width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:600 16px var(--f-ui)}
.brand i{width:10px;height:10px;border-radius:50%;background:var(--rec);box-shadow:0 0 10px var(--rec);display:inline-block}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 10px;border-radius:7px;font-family:var(--f-cond);font-weight:700;font-size:14px;letter-spacing:.03em;color:var(--muted);cursor:pointer;min-height:32px}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:8px 12px;cursor:pointer;font-weight:600;min-height:38px;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{background:var(--raise)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-family:var(--f-cond);font-weight:800;letter-spacing:.04em;text-transform:uppercase;font-size:15px}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:#ff8f86}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.main{display:flex;flex-direction:column;gap:8px;min-width:0}
.stage{background:#05070a;border:1px solid var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;padding:10px;position:relative;min-height:200px}
#cv{display:block;max-width:100%;max-height:56vh;width:auto;height:auto;border-radius:4px;background:#000}
.hint{position:absolute;left:10px;right:10px;bottom:10px;margin:auto;max-width:360px;background:rgba(14,18,24,.88);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--muted);text-align:center;backdrop-filter:blur(6px)}
.hint b{color:var(--fg)}

.transport{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.seekrow{flex:0 0 100%;display:flex;padding:0 4px}
#seek{width:100%;height:30px;margin:0;accent-color:var(--rec);touch-action:none}
.ov{position:absolute;top:8px;z-index:3;display:flex;gap:6px}
.ov.tl{left:8px}.ov.tr{right:8px}
.chip{background:rgba(10,12,16,.72);border:1px solid rgba(255,255,255,.14);color:#fff;border-radius:8px;min-height:32px;min-width:36px;padding:4px 9px;font-family:var(--f-cond);font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(6px)}
.chip svg{width:18px;height:18px}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tc{cursor:default;font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:.02em}
.tc span{color:rgba(255,255,255,.55);margin-left:.3em}
body.theater .toast{bottom:calc(128px + env(safe-area-inset-bottom,0px));z-index:90}
.round.sm{width:38px;height:38px}.round.sm svg{width:18px;height:18px}
#cv{cursor:pointer}
body.theater{overflow:hidden}
body.theater .stage{position:fixed;left:0;right:0;top:0;height:calc(100% - 112px - env(safe-area-inset-bottom,0px));z-index:60;border:0;border-radius:0;min-height:0;padding:0;background:#000}
body.theater #cv{max-height:calc(100% - 16px);max-width:calc(100% - 16px)}
body.theater .ov{top:calc(10px + env(safe-area-inset-top,0px))}
body.theater .ov.tl{left:max(10px,env(safe-area-inset-left,0px))}body.theater .ov.tr{right:max(10px,env(safe-area-inset-right,0px))}
body.theater .hint{display:none}
body.theater .transport{position:fixed;left:0;right:0;bottom:0;z-index:61;background:#000;padding:12px max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.round{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer;padding:0}
.round.big{width:52px;height:52px;background:var(--fg);color:var(--bg);border-color:var(--fg)}
.round svg{width:20px;height:20px}
.spacer{flex:1}

.tools{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
.tool{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:3px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:7px 10px 6px;min-width:64px;cursor:pointer;font-family:var(--f-cond);font-weight:700;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.tool svg{width:20px;height:20px;color:var(--fg)}
.tool:hover{background:var(--raise)}
.tool:disabled{opacity:.35;cursor:default}

.tl-wrap{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 0 6px}
.tl-scroll{overflow-x:auto;overflow-y:hidden;touch-action:pan-x;scrollbar-color:var(--line) transparent}
.tl-inner{position:relative;height:150px;min-width:100%}
.ruler{position:absolute;left:0;right:0;top:0;height:22px;touch-action:none;cursor:ew-resize;border-bottom:1px solid var(--line)}
.tick{position:absolute;top:0;height:22px;border-left:1px solid var(--line);padding-left:4px;font-family:var(--f-cond);font-size:11px;font-weight:600;color:var(--dim);font-variant-numeric:tabular-nums;line-height:22px;white-space:nowrap}
.tick.minor{height:6px;top:16px}
.track{position:absolute;left:0;right:0}
#trV{top:30px;height:56px}
#trT{top:92px;height:24px}
#trA{top:122px;height:22px}
.lane-empty{position:absolute;top:0;bottom:0;display:flex;align-items:center;font-size:12px;color:var(--dim);padding-left:6px;white-space:nowrap;pointer-events:none}
.clip{position:absolute;top:0;bottom:0;border-radius:6px;overflow:hidden;background:#24324a center/auto 100% repeat-x;border:2px solid transparent;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.clip::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,0) 45%)}
.clip .lbl{position:absolute;left:6px;top:3px;right:6px;z-index:1;font-family:var(--f-cond);font-weight:700;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px #000}
.clip .dur{position:absolute;right:5px;bottom:3px;z-index:1;font-family:var(--f-cond);font-size:11px;font-weight:700;background:rgba(0,0,0,.6);padding:0 4px;border-radius:3px;font-variant-numeric:tabular-nums}
.clip .fx{position:absolute;left:5px;bottom:3px;z-index:1;font-size:10px;font-family:var(--f-cond);font-weight:700;color:var(--accent)}
.clip.sel,.bar.sel{border-color:var(--accent)}
.h{position:absolute;top:0;bottom:0;width:16px;z-index:2;display:none;touch-action:none;cursor:ew-resize;background:var(--accent)}
.h::before{content:"";position:absolute;left:7px;top:35%;bottom:35%;width:2px;border-radius:1px;background:var(--accent-ink)}
.h.l{left:-2px;border-radius:5px 0 0 5px}.h.r{right:-2px;border-radius:0 5px 5px 0}
.sel>.h{display:block}
.bar{position:absolute;top:0;bottom:0;box-sizing:border-box;border-radius:5px;border:2px solid transparent;cursor:pointer;font-family:var(--f-cond);font-weight:700;font-size:12px;padding:0 8px;line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar.text{background:var(--text-bar);color:#1b1503}
.bar.text.sel,.bar.audio.sel{touch-action:none}
.bar.audio{background:color-mix(in srgb,var(--audio) 70%,#000);color:#e6fffb;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.18) 0 2px,transparent 2px 5px);background-size:100% 40%;background-repeat:no-repeat;background-position:bottom}
.bar .vseg{position:absolute;top:0;bottom:0;background:rgba(0,0,0,calc(.55 - var(--v)*.5));border-left:1px dashed rgba(255,255,255,.6);border-right:1px dashed rgba(255,255,255,.6);pointer-events:none}
.bar .afade{position:absolute;top:0;bottom:0;pointer-events:none}
.bar .afade.in{left:0;background:linear-gradient(90deg,rgba(0,0,0,.6),transparent)}
.bar .afade.out{right:0;background:linear-gradient(270deg,rgba(0,0,0,.6),transparent)}
.bar .bname{position:relative}
.bar .h{width:12px}.bar .h::before{left:5px}
.playhead{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--rec);pointer-events:none;z-index:5}
.playhead::before{content:"";position:absolute;top:0;left:-6px;border:7px solid transparent;border-top:9px solid var(--rec)}
.zoomrow{display:flex;align-items:center;gap:8px;padding:6px 12px 0;font-family:var(--f-cond);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.zoomrow input{flex:1;max-width:220px}
.snapbtn{min-height:28px;padding:2px 8px;gap:5px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;background:var(--raise);color:var(--muted);border-color:var(--line);backdrop-filter:none}
.snapbtn svg{width:15px;height:15px}
.snapbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.zl{font-size:18px;font-weight:700;color:var(--muted);width:14px;text-align:center}

.insp{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:14px;min-width:0}
.insp h2{margin:0;font-family:var(--f-cond);font-weight:800;font-size:18px;letter-spacing:.03em;text-transform:uppercase;display:flex;align-items:baseline;gap:8px;min-width:0}
.insp h2 small{font-family:var(--f-ui);font-weight:500;font-size:13px;color:var(--muted);text-transform:none;letter-spacing:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.grp{display:flex;flex-direction:column;gap:8px}
.lab{font-family:var(--f-cond);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.lab output{color:var(--fg);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.row{display:flex;gap:6px;flex-wrap:wrap}
.row .btn{flex:1 1 auto}
input[type=range]{width:100%;accent-color:var(--accent);height:28px}

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const FORMATS = { '9:16':[1080,1920,'Reel'], '4:5':[1080,1350,'Post'], '1:1':[1080,1080,'Quadrato'], '16:9':[1920,1080,'Orizz.'] };
const SWATCH = ['#ffffff','#111111','#f5c542','#e63946','#1d4ed8','#0f2c5c','#16a34a','#f97316'];
const uid = () => Math.random().toString(36).slice(2,9);
const clamp = (v,a,b) => Math.min(b, Math.max(a, v));
const even = n => Math.round(n/2)*2;

/* ---------- state ---------- */
const media = new Map();          // id -> {id,type,name,url,el,file,w,h,duration,thumb}
let projectId = uid();
const exampleProject = () => ({
  name:'Esempio', format:'9:16', example:true,
  clips:[{ id:uid(), kind:'card', dur:3, color:'#0f2c5c', fadeIn:0, fadeOut:0.5 }],
  texts:[
    { id:uid(), text:'FUTSAL FABBRICO', style:'title', size:120, y:0.44, color:'#ffffff', bg:'#e63946', anim:'pop', start:0.2, end:3 },
    { id:uid(), text:'Highlights', style:'label', size:64, y:0.56, color:'#111111', bg:'#f5c542', anim:'slide', start:0.6, end:3 }
  ],
  audios:[], library:[], logo:null
});
let P = exampleProject();
let sel = null;        // {type:'clip'|'text'|'audio'|'logo', id}
// porta i progetti vecchi (una sola "music") al nuovo formato con libreria e più brani audio
function normalize(p){
  if (!p.audios) p.audios = [];
  if (!p.texts) p.texts = [];
  if (p.music){
    p.audios.push({ id:uid(), mediaId:p.music.mediaId, name:p.music.name, start:0, offset:p.music.offset || 0, len:36000, volume:p.music.volume ?? 0.8, fadeIn:0, fadeOut:p.music.fadeOut ?? 2 });
    delete p.music;
  }
  if (!p.library){
    p.library = [];
    const add = id => { if (id && !p.library.includes(id)) p.library.push(id); };
    p.clips.forEach(c => add(c.mediaId)); p.audios.forEach(a => add(a.mediaId));
  }
  return p;
}
let T = 0, playing = false, pps = 56;
const undoStack = [];
function snapshot(){ undoStack.push(JSON.stringify(P)); if (undoStack.length > 80) undoStack.shift(); $('#btnUndo').disabled = false; scheduleSave(); }

/* ---------- database locale (IndexedDB) ---------- */
let dbp = null;
function openDB(){
  if (dbp) return dbp;
  dbp = new Promise((res, rej) => {
    if (!('indexedDB' in window)) return rej(new Error('no idb'));
    let r;
    try { r = indexedDB.open('moviola', 1); } catch(e){ return rej(e); }
    r.onupgradeneeded = () => {

const pool = $('#pool');

async function makeThumb(m){

const isAudio = f => f.type.startsWith('audio/') || /\.(mp3|m4a|wav|aac|ogg|flac)$/i.test(f.name);
const isImage = f => f.type.startsWith('image/') || /\.(jpe?g|png|webp|heic|gif)$/i.test(f.name);

async function importFiles(files){
  if (!files.length) return;
  pause();
  let added = 0, failed = [], relinked = 0; const newIds = [];
  toast('Caricamento in corso…', 0);
  for (const f of files){
    if (f.size > 300*1048576) toast(`Apro ${f.name} (${(f.size/1073741824).toFixed(1).replace('.',',')} GB)…`, 0);
    try {
      const pm = pendingRelink.find(p => p.name === f.name && p.size === f.size) || pendingRelink.find(p => p.name === f.name);
      if (pm){
        const m = pm.type === 'video' ? await loadVideo(f, pm.id) : pm.type === 'image' ? await loadImage(f, pm.id) : await loadAudio(f, pm.id);
        if (m.type === 'video') await makeThumb(m);
        media.set(m.id, m); pendingRelink = pendingRelink.filter(p => p !== pm); relinked++;
        continue;
      }
      // stesso file già in libreria: non lo duplico
      const dup = P.library.map(id => media.get(id)).find(m => m && m.name === f.name && m.file && m.file.size === f.size);
      if (dup){ newIds.push(dup.id); continue; }
      let m;
      if (isAudio(f)) m = await loadAudio(f);
      else if (isImage(f)) m = await loadImage(f);
      else { m = await loadVideo(f); await makeThumb(m); }
      media.set(m.id, m); storeFile(m);
      if (!added) snapshot();
      P.library.push(m.id); newIds.push(m.id); added++;
    } catch(e){ failed.push(f.name); }
  }
  refresh(false); scheduleSave();
  if (relinked && !added && !newIds.length && !failed.length){ toast(relinked === 1 ? 'File ricollegato al progetto' : `${relinked} file ricollegati`); return; }
  if (failed.length) toast(`Non riesco a leggere: ${failed.join(', ')}. Prova a convertirlo in MP4 (H.264).`, 5000);
  else $('#toast').hidden = true;
  if (newIds.length){
    libNew = new Set(newIds); setLibOpen(true);
    toast(newIds.length === 1 ? 'Aggiunto alla libreria: trascinalo sulla timeline o toccalo' : `${newIds.length} elementi in libreria`, 3000);
  }
}

}

function syncInspector(){
  const o = findSel(); if (!o || !sel) return;
  if (sel.type === 'clip' && o.kind === 'video'){
    const a = $('#cin'), b = $('#cout');
    if (a){ a.value = o.in; $('#cin_o').textContent = secs(o.in); }
    if (b){ b.value = o.out; $('#cout_o').textContent = secs(o.out); }
    const l = $('#lenO'); if (l) l.textContent = fmtS(clipLen(o));
  } else if (sel.type === 'clip'){ const d = $('#cdur'); if (d){ d.value = o.dur; $('#cdur_o').textContent = secs(o.dur); } }
  else if (sel.type === 'text'){ const t = $('#tTimes'); if (t) t.textContent = `${fmtT(o.start)} → ${fmtT(o.end)}`; }
  else if (sel.type === 'audio'){ const t = $('#aTimes'); if (t) t.textContent = `${fmtT(o.start)} → ${fmtT(o.start + audLen(o))}`; const f = $('#moff'); if (f){ f.value = o.offset; $('#moff_o').textContent = fmtT(o.offset).replace(/\.\d+$/,''); } }
}

insp.addEventListener('input', e => {
  if (e.target.id === 'pname'){ P.name = e.target.value; scheduleSave(); return; }
  const o = findSel(); if (!o) return;
  const id = e.target.id, v = e.target.value;
  const out = $('#' + id + '_o');
  const setOut = s => { if (out) out.textContent = s; };
  switch (id){
    case 'cin': edit(() => { o.in = Math.min(+v, o.out - 0.2); T = layout().find(x => x.c === o).start; }, { seek:true }); setOut(secs(o.in)); syncInspector(); break;
    case 'cout': edit(() => { o.out = Math.max(+v, o.in + 0.2); const L = layout().find(x => x.c === o); T = L.start + L.len - 0.03; }, { seek:true }); setOut(secs(o.out)); syncInspector(); break;
    case 'cdur': edit(() => o.dur = +v); setOut(secs(+v)); break;
    case 'czoom': edit(() => o.zoom = +v, { timeline:false }); setOut((+v).toFixed(2)+'×'); break;
    case 'cpx': edit(() => o.panX = +v, { timeline:false }); setOut(Math.round(v*100)); break;
    case 'cpy': edit(() => o.panY = +v, { timeline:false }); setOut(Math.round(v*100)); break;
    case 'cvol': edit(() => o.volume = +v, { timeline:false }); setOut(pct(+v)); break;
    case 'ccol_c': edit(() => o.color = v); markSw('ccol', v); break;
    case 'ttext': edit(() => o.text = v); break;
    case 'tsize': edit(() => o.size = +v, { timeline:false }); setOut(Math.round(v)); break;
    case 'ty': edit(() => o.y = +v, { timeline:false }); setOut(Math.round(v*100)+'%'); break;
    case 'tcol_c': edit(() => o.color = v, { timeline:false }); markSw('tcol', v); break;
    case 'tbg_c': edit(() => o.bg = v, { timeline:false }); markSw('tbg', v); break;
    case 'mvol': edit(() => o.volume = +v, { timeline:false }); setOut(pct(+v)); break;
    default:
      if (/^vs\d+$/.test(id)){ const i = +id.slice(2); edit(() => { o.vsegs[i].v = +v; }); setOut(Math.round(v*100) + '%'); }
    case 'moff': edit(() => o.offset = +v); setOut(fmtT(+v).replace(/\.\d+$/,'')); break;
    case 'lsize': edit(() => o.size = +v, { timeline:false }); setOut(pct(+v)); break;
    case 'lop': edit(() => o.opacity = +v, { timeline:false }); setOut(pct(+v)); break;
  }
});
function markSw(id, v){ document.querySelectorAll(`[data-sw="${id}"] button`).forEach(b => b.setAttribute('aria-pressed', b.dataset.v === v)); }

insp.addEventListener('click', e => {
  const o = findSel();
  const segB = e.target.closest('[data-seg] button');
  if (segB && segB.parentElement.dataset.seg === 'pfmt'){ setFormat(segB.dataset.v); return; }
  const togB = e.target.closest('[data-tog] button');
  if (togB && o){
    pendingSnap = true;
    edit(() => { o.fx = { ...(o.fx || {}) }; o.fx[togB.dataset.k] = !o.fx[togB.dataset.k]; }, { timeline:false });
    togB.setAttribute('aria-pressed', !!o.fx[togB.dataset.k]);
    if (o.fx[togB.dataset.k]){ const L = layout().find(x => x.c === o); if (L){ T = L.start + 0.01; seekPreview(); updateTime(); } }
    return;
  }
  if (segB && o && /^vsr\d+$/.test(segB.parentElement.dataset.seg)){
    const i = +segB.parentElement.dataset.seg.slice(3); pendingSnap = true;
    edit(() => { o.vsegs[i].r = +segB.dataset.v; }, { rebuild:true }); return;
  }
  if (segB && o && ['ctr','ctd','cspd'].includes(segB.parentElement.dataset.seg)){
    const key = segB.parentElement.dataset.seg, v = segB.dataset.v;
    pendingSnap = true;
    edit(() => {
      if (key === 'ctr') o.trans = { dur:0.5, ...(o.trans || {}), type:v };
      else if (key === 'ctd') o.trans = { type:'dissolve', ...(o.trans || {}), dur:+v };
      else o.speed = +v;
      const L = layout().find(x => x.c === o);
      if (L) T = key === 'cspd' ? L.start : clamp(L.start + L.len - Math.min(o.trans ? o.trans.dur : 0.5, L.len)*0.9, 0, total());
    }, { rebuild:true, seek:true });
    if (key !== 'cspd' && v !== 'none'){ setTimeout(() => { if (!playing) play(); }, 60); }
    return;
  }
  if (e.target.closest('[data-act="done"]')){ select(null); return; }
  if (segB && o){
    const key = segB.parentElement.dataset.seg, v = segB.dataset.v;
    const num = ['fin','fout','mfo','mfi'].includes(key);
    const map = { fit:'fit', fin:'fadeIn', fout:'fadeOut', tstyle:'style', tanim:'anim', mfo:'fadeOut', mfi:'fadeIn', lc:'corner', look:'look', motion:'motion' };
    pendingSnap = true;
    edit(() => {
      o[map[key]] = num ? +v : v;
      if (key === 'tstyle'){ o.size = { title:120, label:64, lower:72, score:72, caption:78, neon:110 }[v]; if (v==='lower' && o.y < 0.6) o.y = 0.8; if (v==='score' && o.y > 0.3 && o.y < 0.7) o.y = 0.12; }
      if (key === 'tanim') T = clamp(o.start + 0.01, 0, total());
    }, { rebuild:true, seek:true });
    return;
  }
  const swB = e.target.closest('[data-sw] button');
  if (swB && o){
    const key = swB.parentElement.dataset.sw, v = swB.dataset.v;
    const map = { ccol:'color', tcol:'color', tbg:'bg' };
    pendingSnap = true; edit(() => o[map[key]] = v, { timeline: key === 'ccol' }); markSw(key, v);
    const ci = $('#' + key + '_c'); if (ci) ci.value = v;
    return;
  }
  const act = e.target.closest('[data-act]')?.dataset.act;
  if (!act) return;
  pendingSnap = true;
  const i = sel && sel.type === 'clip' ? P.clips.indexOf(o) : -1;
  switch (act){
    case 'left': if (i > 0) edit(() => { P.clips.splice(i,1); P.clips.splice(i-1,0,o); }, { rebuild:true, seek:true }); break;
    case 'right': if (i < P.clips.length-1) edit(() => { P.clips.splice(i,1); P.clips.splice(i+1,0,o); }, { rebuild:true, seek:true }); break;
    case 'dup': edit(() => { const c = { ...o, id:uid() }; P.clips.splice(i+1,0,c); sel = { type:'clip', id:c.id }; }, { rebuild:true }); break;
    case 'del': deleteSel(); break;
    case 'cut': split(); break;
    case 'alltr': { const tr = o.trans || { type:'none', dur:0.5 }; edit(() => P.clips.forEach((c,k) => { if (k < P.clips.length - 1) c.trans = { ...tr }; }), { rebuild:true }); toast('Transizione applicata a tutte le clip'); break; }
    case 'alllook': edit(() => P.clips.forEach(c => c.look = o.look || 'none'), { rebuild:true }); toast('Filtro applicato a tutte le clip'); break;
    case 'freeze': freezeFrame(o); break;
    case 'vsa': case 'vsb': {
      const st = sel.type === 'audio' ? o.start : layout().find(x => x.c === o).start;
      const len = sel.type === 'audio' ? audLen(o) : clipLen(o);
      const lt = T - st;
      if (lt < 0 || lt > len){ toast('Porta la linea rossa dentro questo elemento'); break; }
      if (act === 'vsa'){ vsMark = { id:o.id, a:lt }; renderInspector(); toast('Inizio segnato: ora porta la linea rossa alla fine del tratto'); break; }
      if (!vsMark || vsMark.id !== o.id){ toast('Segna prima l’inizio del tratto'); break; }
      const a0 = Math.min(vsMark.a, lt), b0 = Math.max(vsMark.a, lt);
      if (b0 - a0 < 0.2){ toast('Il tratto è troppo corto'); break; }
      edit(() => { o.vsegs = [...(o.vsegs || []), { a:a0, b:b0, v:0.25, r:0.5 }]; }, { rebuild:true });
      vsMark = null; renderInspector(); toast('Tratto creato al 25%: regola il volume con il cursore'); break;
    }
    case 'vsdel': { const i = +e.target.closest('[data-i]').dataset.i; edit(() => { o.vsegs = o.vsegs.filter((_,k) => k !== i); }, { rebuild:true }); break; }
    case 'tstart': edit(() => { o.start = clamp(T, 0, o.end - 0.3); }, { rebuild:true }); break;
    case 'tend': edit(() => { o.end = Math.max(T, o.start + 0.3); }, { rebuild:true }); break;
    case 'tdup': edit(() => { const len = o.end - o.start; const c = { ...o, id:uid(), start:T, end:T + len }; P.texts.push(c); sel = { type:'text', id:c.id }; }, { rebuild:true }); break;
    case 'tdel': deleteSel(); break;
    case 'astart': edit(() => { o.start = Math.max(0, T); }, { rebuild:true }); break;
    case 'aend': if (T > o.start + 0.3){ edit(() => { const m = media.get(o.mediaId); o.len = Math.min(T - o.start, m ? m.duration - o.offset : T - o.start); }, { rebuild:true }); } else toast('Porta la linea rossa dopo l’inizio del brano'); break;
    case 'adup': edit(() => { const c = { ...o, id:uid(), start:o.start + audLen(o), len:audLen(o) }; P.audios.push(c); sel = { type:'audio', id:c.id }; }, { rebuild:true }); break;
    case 'adel': deleteSel(); break;
    case 'lrep': $('#fileLogo').click(); break;
    case 'ldel': deleteSel(); break;
  }
});

/* ---------- tools ---------- */
function deleteSel(){
  if (!sel) { toast('Seleziona prima qualcosa nella timeline'); return; }
  pause(); snapshot();
  if (sel.type === 'clip') P.clips = P.clips.filter(c => c.id !== sel.id);
  else if (sel.type === 'text') P.texts = P.texts.filter(c => c.id !== sel.id);
  else if (sel.type === 'audio') P.audios = P.audios.filter(a => a.id !== sel.id);
  else if (sel.type === 'logo') P.logo = null;
  sel = null; T = Math.min(T, total());
  refresh(true);
}
function split(){
  pause();
  if (sel && sel.type === 'text'){
    const x = findSel();
    if (T > x.start + 0.2 && T < x.end - 0.2){ snapshot(); const b = { ...x, id:uid(), start:T }; x.end = T; P.texts.push(b); sel = { type:'text', id:b.id }; refresh(true); return; }
  }
  if (sel && sel.type === 'audio'){
    const a = findSel(), L = audLen(a);
    if (T > a.start + 0.2 && T < a.start + L - 0.2){
      snapshot(); const lt = T - a.start;
      const b = { ...a, id:uid(), start:T, offset:a.offset + lt, len:L - lt, fadeIn:0, vsegs:(a.vsegs || []).map(s => ({ ...s, a:s.a - lt, b:s.b - lt })).filter(s => s.b > 0) }; a.len = lt; a.fadeOut = 0;
      a.vsegs = (a.vsegs || []).filter(s => s.a < lt);
      P.audios.push(b); sel = { type:'audio', id:b.id }; refresh(true); return;
    }
    toast('Porta la linea rossa dentro il brano'); return;
  }
  const o = clipAt(T);
  if (!o){ toast('Niente da dividere qui'); return; }
  const lt = T - o.start;
  if (lt < 0.1 || lt > o.len - 0.1){ toast('Sposta la linea rossa dentro la clip'); return; }
  snapshot();
  const c = o.c, b = { ...c, id:uid(), vsegs:(c.vsegs || []).map(s => ({ ...s, a:s.a - lt, b:s.b - lt })).filter(s => s.b > 0) };
  c.vsegs = (c.vsegs || []).filter(s => s.a < lt);
  if (c.kind === 'video'){ b.in = c.in + lt*spd(c); c.out = b.in; }
  else { b.dur = c.dur - lt; c.dur = lt; }

const fmtHL = t => { t = Math.max(0, Math.round(t*10)/10); const h = Math.floor(t/3600), m = Math.floor(t%3600/60), sec = t%60;

function parseTime(str){

function parseHL(text, maxDur){
  const ok = [], bad = [];
  String(text || '').split('\n').forEach((raw, i) => {
    const line = raw.trim(); if (!line || line.startsWith('#')) return;
    let m = line.match(/^([\d:.,]+)\s*\+\s*([\d.,]+)\s*(.*)$/), a, b, label;
    if (m){ a = parseTime(m[1]); b = a + parseTime(m[2]); label = m[3]; }
    else {
      m = line.match(/^([\d:.,]+)\s*(?:-|–|—|→|>)\s*([\d:.,]+)\s*(.*)$/);
      if (!m){ bad.push(i+1); return; }
      a = parseTime(m[1]); b = parseTime(m[2]); label = m[3];
    }
    if (isNaN(a) || isNaN(b) || b - a < 0.3 || (maxDur && a >= maxDur)){ bad.push(i+1); return; }
    if (maxDur) b = Math.min(b, maxDur);

async function mp4IndexFor(m){

  return mp4Idx.get(m.id);
}
// audio di una clip video: solo il tratto usato, letto dal file MP4/MOV; se non si può, decodifica classica
async function getClipAudio(c){

  const key = `${c.mediaId}@${c.in.toFixed(3)}-${c.out.toFixed(3)}`;
  if (clipAudioCache.has(key)) return clipAudioCache.get(key);
  let res = null;
  const idx = await mp4IndexFor(m);
  if (idx === null) res = { silent:true };
  else if (idx && !idx.error){
    try { const d = await MP4A.decodeRange(m.file, idx, Math.max(0, c.in - 0.2), c.out + 0.2); res = d ? { buf:d.buf, base:d.base } : { silent:true }; }
    catch(e){ res = null; }
  }
  if (!res){
    const buf = await getAudioBuffer(c.mediaId);
    res = buf ? { buf, base:0 } : { fail:true };
  }
  clipAudioCache.set(key, res);
  return res;
}
async function getAudioBuffer(mediaId){

  if (!m) return null;

    const ab = await m.file.arrayBuffer();
    try { buf = await new OfflineAudioContext(2, 1, 48000).decodeAudioData(ab.slice(0)); }
    catch(e){ buf = await new Promise((res, rej) => { const p = new OfflineAudioContext(2, 1, 44100).decodeAudioData(ab, res, rej); if (p && p.catch) p.catch(rej); }); }

// nodo di guadagno che riproduce i "tratti" di volume nel mix finale
function segNode(oc, item, t0){
  const g = oc.createGain(); g.connect(oc.destination);

  g.gain.setValueAtTime(1, 0);
  for (const sg of segs){
    const r = sg.r ?? 0.5;
    g.gain.setValueAtTime(1, Math.max(0, t0 + sg.a - r));
    g.gain.linearRampToValueAtTime(sg.v, Math.max(0, t0 + sg.a));
    g.gain.setValueAtTime(sg.v, Math.max(0, t0 + sg.b));
    g.gain.linearRampToValueAtTime(1, t0 + sg.b + r);
  }

}

const Q_MBPS = { 1:12, 2:24, 3:45 };
function exportBitrate(opt, W, H){

async function saveVideo(blob, name){
  let dl = null;
  try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch(e){ dl = null; }
  if (dl){
    try { await dl.save({ filename:name, data:blob }); toast('Video salvato'); }
    catch(e){
      if (e && e.code === 'declined') toast('Salvataggio annullato');
      else if (e && e.code === 'rate_limited') toast('C’è già una richiesta aperta, riprova tra poco');
      else toast('Salvataggio non disponibile qui', 3500);
    }
    return;
  }
  const file = new File([blob], name, { type:'video/mp4' });
  if (/iP(hone|ad|od)/.test(navigator.userAgent) && navigator.canShare && navigator.canShare({ files:[file] })){

}

const APP_BUILD = '2026-11-02T01:33:02';
const onPages = () => location.protocol === 'https:' && /\.github\.io$/.test(location.hostname);
const BUILD_RE = new RegExp("APP_" + "BUILD = '([0-9T:.-]+)'");

['pointerdown','keydown'].forEach(ev => window.addEventListener(ev, () => userActed = true, { once:true, capture:true }));
async function checkUpdate(manual, atOpen){
  if (!onPages()){ if (manual) toast('Gli aggiornamenti si controllano dall’app su GitHub Pages'); return; }
  lastUpdCheck = Date.now();
  try {
    const r = await fetch(location.pathname + '?v=' + Date.now(), { cache:'no-store' });
    if (!r.ok) throw new Error(r.status);
    const m = (await r.text()).match(BUILD_RE);
    if (!m){ if (manual) toast('Non riesco a leggere la versione online'); return; }
    // aggiorna solo verso versioni PIÙ NUOVE (mai tornare indietro se GitHub serve ancora un file vecchio)
    if (m[1] > APP_BUILD){
      // all'apertura, se non hai ancora toccato niente, aggiorna da solo; mentre lavori mostra solo l'avviso
      if (atOpen && !userActed && $('#scrim').hidden){ toast('Aggiorno all’ultima versione…', 0); applyUpdate(); return; }
      if (manual || updDismissed !== m[1]){ $('#upd').hidden = false; $('#upd').dataset.v = m[1]; }
    }
    else if (manual) toast('Hai già l’ultima versione');
  } catch(e){ if (manual) toast('Controllo non riuscito: sei connesso a internet?'); }
}
async function applyUpdate(){
  $('#upd').querySelector('span').textContent = 'Aggiorno…';
  try { await saveNow(); } catch(e){}
  // scarica la versione nuova e sostituisce quella che il telefono teneva in memoria
  try { await fetch(location.pathname, { cache:'reload' }); } catch(e){}
  try { localStorage.setItem('moviola:updated', '1'); } catch(e){}
  location.replace(location.pathname + '?v=' + Date.now());
}

document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - lastUpdCheck > 60000) checkUpdate(false); });
setTimeout(() => checkUpdate(false, true), 600);
try { if (localStorage.getItem('moviola:updated')){ localStorage.removeItem('moviola:updated'); setTimeout(() => toast(`Moviola aggiornata · versione ${APP_BUILD.slice(0,16).replace('T',' ')}`, 3000), 900); } } catch(e){}

/* ---------- boot ---------- */
window.addEventListener('resize', () => renderTimeline());
sizePreview(); renderTimeline(); renderInspector(); updateTime();
T = 1.6; updateTime(); draw();
(async () => {
  try {
    const all = await dbGetAll('projects');
    if (!all.length){ setSaveState(''); return; }
    let last = null; try { last = localStorage.getItem('moviola:last'); } catch(e){}
    const rec = all.find(r => r.id === last) || all.sort((a,b) => b.updated - a.updated)[0];
    await loadProject(rec);
    gcFiles();
  } catch(e){ dbOK = false; setSaveState(''); }
})();
document.addEventListener('visibilitychange', () => { if (document.hidden && saveTimer) saveNow(); });
if (document.fonts) {
  Promise.all(['120px Anton','800 64px "Barlow Condensed"','600 40px Barlow'].map(f => document.fonts.load(f).catch(()=>{}))).then(() => draw());
}
})();
</script>
